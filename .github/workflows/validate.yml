name: Validate Jubbir Printers

on:
  push:
    branches:
      - main
      - production-desk-v1
      - hostinger-static
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package.json

      - name: Install dependencies
        run: npm install

      - name: TypeScript validation
        run: npm run lint

      - name: Job brief regression tests
        run: npm test

      - name: Production build
        run: npm run build -- --emptyOutDir=false

      - name: Install test browser
        run: npx playwright install --with-deps chromium

      - name: Browser regression tests
        run: npm run test:browser

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jubbir-browser-evidence
          path: test-results/
          retention-days: 7
