# Retained as a manual, non-publishing build audit.
# The only automatic production publisher is publish-gh-pages.yml.
# No branch replacement, forced pushes, or file removal are performed here.
name: Audit Jubbir production build (manual only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate TypeScript
        run: npm run lint

      - name: Run brief regression tests
        run: npm test

      - name: Verify production build
        run: npm run build -- --base=/
