# Retained as a manual, non-publishing build audit.\n# The only automatic production publisher is publish-gh-pages.yml.\n# No branch replacement, forced pushes, or file removal are performed here.\nname: Audit Jubbir production build (manual only)\n\non:\n  workflow_dispatch:\n\npermissions:\n  contents: read\n\njobs:\n  audit:\n    runs-on: ubuntu-latest\n    timeout-minutes: 15\n    steps:\n      - name: Checkout repository\n        uses: actions/checkout@v4\n\n      - name: Setup Node\n        uses: actions/setup-node@v4\n        with:\n          node-version: 20\n          cache: npm\n          cache-dependency-path: package-lock.json\n\n      - name: Install dependencies\n        run: npm ci\n\n      - name: Validate TypeScript\n        run: npm run lint\n\n      - name: Run brief regression tests\n        run: npm test\n\n      - name: Verify production build\n        run: npm run build -- --base=/\n