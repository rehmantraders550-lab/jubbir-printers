name: Publish Jubbir Printers Branch

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package.json

      - name: Install dependencies
        run: npm install

      - name: Validate TypeScript
        run: npm run lint

      - name: Build static site
        run: npm run build -- --base=/

      - name: Publish gh-pages branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf /tmp/jubbir-pages
          mkdir -p /tmp/jubbir-pages
          cp -R dist/. /tmp/jubbir-pages/
          touch /tmp/jubbir-pages/.nojekyll
          git fetch origin gh-pages || true
          git checkout --orphan gh-pages
          git rm -rf . || true
          cp -R /tmp/jubbir-pages/. .
          git add -A
          git commit -m "Publish Jubbir Printers"
          git push --force origin gh-pages


      - name: Refresh custom domain certificate and enforce HTTPS
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          endpoint="repos/${GITHUB_REPOSITORY}/pages"

          gh api --method PUT "$endpoint"             --header "X-GitHub-Api-Version: 2022-11-28"             -f cname=jubbirprinters.com >/dev/null

          for attempt in {1..40}; do
            certificate_state="$(gh api "$endpoint"               --header "X-GitHub-Api-Version: 2022-11-28"               --jq '.https_certificate.state // "unknown"')"
            echo "Certificate state: ${certificate_state} (attempt ${attempt})"
            if [[ "$certificate_state" == "approved" ]]; then
              gh api --method PUT "$endpoint"                 --header "X-GitHub-Api-Version: 2022-11-28"                 -F https_enforced=true >/dev/null
              exit 0
            fi
            sleep 30
          done

          echo "::error::GitHub did not approve the custom certificate within 20 minutes."
          exit 1
